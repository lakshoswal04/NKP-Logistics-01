# Local development stack. Production is Render (api + Postgres) and Vercel
# (web) — see DEPLOYMENT.md.

services:
  db:
    # Plain Postgres 16, matching the Render blueprint. PostGIS was here
    # previously but no geometry types are used — routes are stored as plain
    # lat/lng floats and projected in the client.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nkp
      POSTGRES_PASSWORD: nkp
      POSTGRES_DB: nkp_logistics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nkp -d nkp_logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://nkp:nkp@db:5432/nkp_logistics
      CORS_ORIGINS: http://localhost:5001
      SEED_ON_START: "true"
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # Build-time, not runtime — see the note in frontend/Dockerfile.
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "5001:5001"
    depends_on:
      - api

volumes:
  pgdata:
